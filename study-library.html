<style>
  .lib-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;}
  .lib-row .chip{font-size:12.5px;}
  .lib-row .chip.on{background:var(--primary);border-color:var(--primary-deep);color:#fff;box-shadow:0 2px 0 var(--primary-deep);}
  .lib-row .chip.memo.on{background:var(--accent);border-color:var(--accent-deep);color:#fff;box-shadow:0 2px 0 var(--accent-deep);}
  .lib-row .chip.fav.on{background:var(--rose);border-color:#A85F4B;color:#fff;box-shadow:0 2px 0 #A85F4B;}
  /* 行式条目（博客精选风格） */
  .l-row{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1.5px solid var(--line);border-radius:11px;
    margin-bottom:8px;background:var(--card);transition:all .15s;box-shadow:var(--shadow);}
  .l-row:hover{transform:translateY(-2px);border-color:var(--primary);box-shadow:var(--shadow-hover);}
  .l-row .l-ic{flex:0 0 auto;width:34px;height:34px;display:flex;align-items:center;justify-content:center;font-size:17px;
    background:var(--primary-soft);border:1.5px solid var(--line);border-radius:9px;}
  .l-row .l-tx{flex:1;min-width:0;}
  .l-row .l-t{font-size:13.5px;font-weight:700;color:var(--t1);letter-spacing:.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .l-row .l-t .tag{font-size:10.5px;color:var(--primary-deep);background:var(--primary-soft);border-radius:6px;padding:2px 7px;letter-spacing:1px;font-weight:400;margin-left:6px;}
  .l-row .l-t .favtag{font-size:11px;color:var(--accent-deep);margin-left:4px;}
  .l-row .l-d{font-size:11px;color:var(--t3);margin-top:3px;letter-spacing:.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .l-row .l-ops{flex:0 0 auto;display:flex;gap:5px;}
  .l-row .mini-btn{padding:6px 9px;font-size:12px;border-radius:8px;}
  .l-row .mini-btn.star{color:var(--accent-deep);}
  .l-row .mini-btn.star.on{background:var(--accent);border-color:var(--accent-deep);color:#fff;box-shadow:0 2px 0 var(--accent-deep);}
  .l-row .mini-btn.del:hover{color:var(--rose);border-color:var(--rose);}
  .item-body{font-size:13px;color:var(--t2);line-height:1.9;white-space:pre-wrap;word-break:break-word;max-height:46vh;overflow-y:auto;padding:4px 2px;}
  .item-body img{max-width:100%;border-radius:10px;border:1.5px solid var(--line);}
  .file-card{display:flex;align-items:center;gap:10px;background:var(--primary-soft);border:1.5px solid rgba(111,190,158,.4);border-radius:10px;padding:10px 12px;margin-top:10px;}
  .file-card .fx{flex:1;min-width:0;}
  .file-card .fn{font-size:12.5px;font-weight:700;color:var(--t1);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .file-card .fm{font-size:11px;color:var(--t3);margin-top:2px;}
  .add-box{background:var(--card);border:1.5px dashed var(--primary);border-radius:12px;padding:12px;margin-top:4px;}
  .add-box input,.add-box textarea{width:100%;font-family:inherit;font-size:13px;padding:9px 11px;border:1.5px solid var(--line);
    border-radius:9px;background:#fff;color:var(--t1);outline:none;margin-bottom:8px;transition:border-color .15s;}
  .add-box input:focus,.add-box textarea:focus{border-color:var(--primary);}
  .add-box textarea{resize:vertical;min-height:64px;line-height:1.7;}
  .add-box .btns{display:flex;gap:8px;flex-wrap:wrap;}
  .add-box .btns .btn{flex:1;padding:10px 0;font-size:13px;min-width:100px;}
  .memo-tip{font-size:11.5px;color:var(--t3);letter-spacing:1px;margin-bottom:10px;line-height:1.8;}
  .scan-bar{display:flex;gap:8px;align-items:center;margin-bottom:8px;flex-wrap:wrap;}
  .scan-bar .note{font-size:11px;color:var(--t3);letter-spacing:.5px;flex:1;min-width:180px;}
  .filehide{display:none;}
</style>

<div class="modal" id="catModal">
  <div class="modal-box" style="max-width:400px;">
    <h3><span class="mico">🗂</span>管理分类</h3>

<script src="town.js"></script>
<script>
var DEFAULT_CATS=['语文','数学','英语','专业课','竞赛','通用'];
var TYPES=[['notes','📝','笔记'],['slides','📄','课件'],['practice','✍️','刷题记录'],['memo','🗒','备忘录']];
var ls={get:function(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}},set:function(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
var items=ls.get('study-v1-library');
if(!Array.isArray(items))items=[];
var CATS=ls.get('study-v1-cats');
if(!Array.isArray(CATS)||!CATS.length)CATS=DEFAULT_CATS.slice();
function saveCats(){ls.set('study-v1-cats',CATS);}
var cat='全部',type='notes',favOnly=false,editingId=null;

function save(){ls.set('study-v1-library',items);}
function fmtSize(b){return b>1048576?(b/1048576).toFixed(1)+'MB':b>1024?(b/1024).toFixed(0)+'KB':b+'B';}

/* 分类 chips */
var catRow=document.getElementById('catRow');
function renderCats(){
  catRow.innerHTML='';
  ['全部','⭐ 收藏'].concat(CATS).forEach(function(c){
    var chip=document.createElement('div');
    chip.className='chip'+(c==='⭐ 收藏'?' fav':'')+(c===cat?' on':'');
    chip.textContent=c;
    chip.onclick=function(){
      cat=c;
      Array.prototype.forEach.call(catRow.children,function(x){x.classList.remove('on');});
      chip.classList.add('on');
      render();
    };
    catRow.appendChild(chip);
  });
}
renderCats();

/* 类型 tabs */
var typeRow=document.getElementById('typeRow');
TYPES.forEach(function(t){
  var chip=document.createElement('div');
  chip.className='chip'+(t[1]==='🗒'?' memo':'')+(t[0]===type?' on':'');
  chip.textContent=t[1]+' '+t[2];
  chip.onclick=function(){
    type=t[0];
    Array.prototype.forEach.call(typeRow.children,function(x){x.classList.remove('on');});
    chip.classList.add('on');
    editingId=null;resetForm();
    render();
  };
  typeRow.appendChild(chip);
});

/* 过滤 */
function visible(){
  return items.filter(function(it){
    var okType=type==='memo'?(it.type==='notes'):(it.type===type);
    var okCat=cat==='全部'||(cat==='⭐ 收藏'?!!it.fav:it.cat===cat);
    return okType&&okCat;
  }).sort(function(a,b){return b.ts-a.ts;});
}
function typeLabel(tp){var t=TYPES.filter(function(x){return x[0]===tp;})[0];return t?t[2]:'';}

/* 行式渲染（博客精选风格） */
function render(){
  var t=TYPES.filter(function(x){return x[0]===type;})[0];
  document.getElementById('typePix').textContent=t[1];
  document.getElementById('typeName').textContent=t[2];
  document.getElementById('memoTip').textContent=
    type==='memo'?'🗒 备忘录与笔记互通：这里汇总了所有分类里记下的笔记，随手记的都在。':
    (type==='notes'?'📝 在这里记的笔记，会自动出现在「备忘录」里（互通）。':'');
  var list=document.getElementById('itemList');
  var arr=visible();
  if(!arr.length){
    if(type==='memo')townEmpty(list,{art:'book',title:'备忘录还空着',desc:'去任意分类记一篇笔记，都会汇总到这里',mini:true});
    else if(cat==='⭐ 收藏')townEmpty(list,{art:'star',title:'还没有收藏',desc:'看到有用的资料点 ☆ 收藏，随时回来找',mini:true});
    else townEmpty(list,{art:'note',title:'这里还空着',desc:'写第一条吧，或导入课件、扫描笔记 ✏️',mini:true});
    return;
  }
  list.innerHTML='';
  arr.forEach(function(it){
    var row=document.createElement('div');
    row.className='l-row';
    var ico=it.file?(it.file.kind==='img'?'🖼':(it.file.kind==='text'?'📄':'🗂')):(it.type==='notes'?'📝':it.type==='slides'?'📄':it.type==='practice'?'✍️':'🗒');
    row.innerHTML='<span class="l-ic">'+ico+'</span>'+
      '<div class="l-tx"><div class="l-t">'+escapeHtml(it.title||'(无标题)')+'<span class="tag">'+it.cat+'</span>'+(it.fav?'<span class="favtag">⭐</span>':'')+'</div>'+
      '<div class="l-d">'+typeLabel(it.type)+' · '+fmtDate(it.ts)+(it.file?' · 📎 '+escapeHtml(it.file.name):'')+'</div></div>'+
      '<div class="l-ops">'+
        '<button class="mini-btn star'+(it.fav?' on':'')+'" title="收藏">'+(it.fav?'★':'☆')+'</button>'+
        '<button class="mini-btn" title="查看">👁</button>'+
        '<button class="mini-btn del" title="删除">✕</button>'+
      '</div>';
    row.querySelector('.star').onclick=function(){
      it.fav=!it.fav;save();render();
      townToast(it.fav?'已收藏 ⭐':'已取消收藏');
    };
    row.querySelector('.mini-btn[title="查看"]').onclick=function(){openView(it);};
    row.querySelector('.del').onclick=function(){
      if(!confirm('删除「'+it.title+'」？'))return;
      items=items.filter(function(x){return x.id!==it.id;});
      save();render();
      townToast('已删除');
    };
    list.appendChild(row);
  });
}
function escapeHtml(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function fmtDate(ts){
  var d=new Date(ts),p=function(n){return String(n).padStart(2,'0');};
  return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())+' '+p(d.getHours())+':'+p(d.getMinutes());
}

/* 查看弹窗 */
var viewModal=document.getElementById('viewModal'),viewId=null;
function openView(it){
  viewId=it.id;
  document.getElementById('vTitle').textContent=it.title||'(无标题)';
  document.getElementById('vIco').textContent=it.file?(it.file.kind==='img'?'🖼':'🗂'):'📄';
  var body='';
  if(it.body)body+='<div>'+escapeHtml(it.body)+'</div>';
  if(it.file){
    if(it.file.kind==='img')body+='<img src="'+it.file.data+'" alt="'+escapeHtml(it.file.name)+'">';
    else if(it.file.kind==='text')body+='<div style="margin-top:10px;font-size:12px;color:var(--t3);">📄 '+escapeHtml(it.file.name)+'（文本内容）</div>';
    body+='<div class="file-card"><div class="fx"><div class="fn">📎 '+escapeHtml(it.file.name)+'</div><div class="fm">'+fmtSize(it.file.size)+'</div></div>'+
      '<a class="btn ghost" href="'+it.file.data+'" download="'+escapeHtml(it.file.name)+'" style="padding:8px 14px;font-size:12px;text-decoration:none;">下载</a></div>';
  }
  document.getElementById('vBody').innerHTML=body||'<span style="color:var(--t3);">（空内容）</span>';
  document.getElementById('vFav').textContent=it.fav?'★ 已收藏':'☆ 收藏';
  viewModal.classList.add('show');
}
document.getElementById('vClose').onclick=function(){viewModal.classList.remove('show');};
document.getElementById('vFav').onclick=function(){
  var it=items.filter(function(x){return x.id===viewId;})[0];
  if(!it)return;
  it.fav=!it.fav;save();
  document.getElementById('vFav').textContent=it.fav?'★ 已收藏':'☆ 收藏';
  render();
  townToast(it.fav?'已收藏 ⭐':'已取消收藏');
};
document.getElementById('vEdit').onclick=function(){
  var it=items.filter(function(x){return x.id===viewId;})[0];
  if(!it)return;
  viewModal.classList.remove('show');
  startEdit(it);
};

/* 表单 */
function resetForm(){
  document.getElementById('addTitle').value='';
  document.getElementById('addBody').value='';
  document.getElementById('cancelEdit').style.display='none';
  document.getElementById('addBtn').textContent='保存';
  editingId=null;
}
function startEdit(it){
  editingId=it.id;
  document.getElementById('addTitle').value=it.title;
  document.getElementById('addBody').value=it.body||'';
  document.getElementById('cancelEdit').style.display='';
  document.getElementById('addBtn').textContent='更新';
  window.scrollTo({top:document.body.scrollHeight,behavior:'smooth'});
}
document.getElementById('cancelEdit').onclick=function(){resetForm();};
document.getElementById('addBtn').onclick=function(){
  var title=document.getElementById('addTitle').value.trim();
  var body=document.getElementById('addBody').value.trim();
  if(!title&&!body){townToast('写点什么再保存呀 ✏️');return;}
  var targetCat=cat==='全部'||cat==='⭐ 收藏'?'通用':cat;
  var targetType=type==='memo'?'notes':type;
  if(editingId){
    var it=items.filter(function(x){return x.id===editingId;})[0];
    if(it){it.title=title||it.title;it.body=body;it.ts=Date.now();}
    save();resetForm();render();
    townToast('已更新 ✨');
    return;
  }
  items.push({id:'L'+Date.now(),cat:targetCat,type:targetType,title:title||'(无标题)',body:body,ts:Date.now()});
  save();resetForm();render();
  townToast(type==='memo'?'已记入备忘录，也同步到笔记啦 🗒':'已保存到 '+targetCat+' · '+TYPES.filter(function(t){return t[0]===targetType;})[0][2]);
};

/* 导入文件（课件等，≤2MB 存本地） */
document.getElementById('fileBtn').onclick=function(){document.getElementById('impFile').click();};
document.getElementById('impFile').onchange=function(){
  var f=this.files[0];this.value='';
  if(!f)return;
  if(f.size>2*1024*1024){townToast('文件超过 2MB 啦，压缩或裁剪后再导入');return;}
  var targetCat=cat==='全部'||cat==='⭐ 收藏'?'通用':cat;
  var rd=new FileReader();
  rd.onload=function(){
    var kind=/^image\//.test(f.type)?'img':/^text\//.test(f.type)?'text':'file';
    items.push({id:'L'+Date.now(),cat:targetCat,type:'slides',title:f.name.replace(/\.[^.]+$/,''),body:kind==='text'?String(rd.result):'',file:{name:f.name,size:f.size,kind:kind,data:String(rd.result)},ts:Date.now()});
    save();render();
    townToast('已导入「'+f.name+'」📎');
  };
  rd.readAsDataURL(f);
};

/* 扫描识别（tesseract.js OCR，图片 → 文字） */
function loadTesseract(cb){
  if(window.Tesseract){cb();return;}
  var s=document.createElement('script');
  s.src='https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js';
  s.onload=cb;
  s.onerror=function(){townToast('识别组件下载失败，检查网络后再试');};
  document.head.appendChild(s);
}
document.getElementById('scanBtn').onclick=function(){document.getElementById('scanFile').click();};
document.getElementById('scanFile').onchange=function(){
  var f=this.files[0];this.value='';
  if(!f)return;
  if(!/^image\//.test(f.type)){townToast('请选择图片文件 🖼');return;}
  var btn=document.getElementById('scanBtn'),note=document.getElementById('scanNote');
  btn.textContent='⏳ 识别中…';
  note.textContent='首次使用需下载中文识别包（约 15MB），耐心等一会儿…';
  loadTesseract(function(){
    Tesseract.recognize(f,'chi_sim',{logger:function(m){
      if(m.status==='recognizing text')note.textContent='识别中… '+Math.round((m.progress||0)*100)+'%';
    }}).then(function(res){
      var txt=(res&&res.data&&res.data.text)||'';
      document.getElementById('addBody').value=txt.trim();
      btn.textContent='🔍 扫描识别';
      note.textContent='识别完成，检查一下内容，可直接保存为笔记 ✨';
      townToast('扫描完成，可编辑后保存 🔍');
    }).catch(function(e){
      btn.textContent='🔍 扫描识别';
      note.textContent='课件可导入文件；扫描可识别图片里的文字（首次需下载识别包，约 15MB）';
      townToast('识别失败：'+(e&&e.message?e.message:e));
    });
  });
};

/* 分类管理 */
var catModal=document.getElementById('catModal');
document.getElementById('catMgmt').onclick=function(){renderCatList();catModal.classList.add('show');};
document.getElementById('cnClose').onclick=function(){catModal.classList.remove('show');};
function renderCatList(){
  var el=document.getElementById('catList');
  el.innerHTML='';
  CATS.forEach(function(c,i){
    var n=items.filter(function(x){return x.cat===c;}).length;
    var row=document.createElement('div');
    row.style.cssText='display:flex;align-items:center;gap:9px;padding:9px 2px;border-bottom:1.5px dashed var(--line-soft);';
    row.innerHTML='<span style="font-size:13.5px;color:var(--t2);letter-spacing:1px;flex:1;">'+c+' <span style="color:var(--t3);font-size:11px;">（'+n+' 条）</span></span>'+
      '<button class="cn-del" style="border:none;background:none;color:var(--t3);cursor:pointer;font-size:12.5px;padding:5px 8px;border-radius:7px;">✕ 删除</button>';
    row.querySelector('.cn-del').onclick=function(){
      if(CATS.length<=1){townToast('至少保留一个分类');return;}
      if(!confirm('删除分类「'+c+'」？该分类下的 '+n+' 条资料会保留（在「全部」中可见）。'))return;
      CATS.splice(i,1);saveCats();
      renderCatList();renderCats();
      if(cat===c)cat='全部';
      render();
      townToast('已删除分类');
    };
    el.appendChild(row);
  });
}
document.getElementById('cnAdd').onclick=function(){
  var n=document.getElementById('cnName').value.trim();
  if(!n){townToast('填个分类名呀 🗂');return;}
  if(CATS.indexOf(n)>=0){townToast('这个分类已经有了');return;}
  if(CATS.length>=12){townToast('分类够多啦');return;}
  CATS.push(n);saveCats();
  document.getElementById('cnName').value='';
  renderCatList();renderCats();
  townToast('已添加分类「'+n+'」');
};
document.getElementById('cnName').addEventListener('keydown',function(e){if(e.key==='Enter')document.getElementById('cnAdd').click();});

render();
</script>
</body>
</html>
