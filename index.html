<style>
  /* 首页专用：白天/黑夜都适配（模式由全站切换按钮控制） */
  /* 夜空装饰：仅夜间模式显示 */
  .night-sky{position:fixed;inset:0;z-index:-3;pointer-events:none;}
  .moon{position:fixed;top:26px;right:36px;z-index:-2;width:64px;height:64px;image-rendering:pixelated;
    filter:drop-shadow(0 0 22px rgba(246,221,150,.35));animation:moonfloat 7s ease-in-out infinite;}
  .moon rect{fill:#F2E4B3;}
  @keyframes moonfloat{0%,100%{transform:translateY(0);}50%{transform:translateY(-6px);}}
  body:not(.night) .moon,body:not(.night) #nightSky{display:none;}
  .star{position:fixed;width:3px;height:3px;background:#EAF3FF;border-radius:50%;z-index:-2;opacity:.85;
    animation:tw 3.2s ease-in-out infinite;}
  @keyframes tw{0%,100%{opacity:.2;}50%{opacity:.95;}}
  /* 时钟：白天深色，夜间柔光 */
  .clk{font-family:var(--pixel);font-size:42px;color:var(--t1);text-align:center;letter-spacing:4px;margin:8px 0 4px;}
  body.night .clk{color:#F5F8FC;text-shadow:0 0 22px rgba(246,196,83,.28),0 0 60px rgba(111,190,158,.18);}
  .clk-sub{text-align:center;font-size:12px;color:var(--t3);letter-spacing:3px;}
  /* 倒计时 */
  .cd{border-bottom-color:var(--line-soft);}
  body.night .cd .days{color:var(--primary);}
  body.night .cd .days.hot{color:#E19A84;}
  body.night .cd .days.today{color:var(--accent);}
  /* 学习进度 */
  .study-hero{text-align:center;padding:6px 0 2px;}
  .study-hero .big{font-family:var(--pixel);font-size:34px;color:var(--primary-deep);}
  body.night .study-hero .big{color:var(--primary);text-shadow:0 0 18px rgba(111,190,158,.4);}
  .study-hero .big small{font-family:var(--font);font-size:13px;color:var(--t3);letter-spacing:2px;}
  .study-hero .line{margin-top:10px;font-size:13px;color:var(--t2);letter-spacing:1px;line-height:2;}
  .study-hero .line b{color:var(--primary-deep);}
  body.night .study-hero .line b{color:var(--primary);}
  .study-meta{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin-top:12px;}
  .study-meta .pill{font-size:11.5px;color:var(--t2);background:var(--primary-soft);
    border:1.5px solid rgba(111,190,158,.35);border-radius:999px;padding:4px 13px;letter-spacing:1px;}
  .study-meta .pill b{color:var(--primary-deep);}
  body.night .study-meta .pill b{color:var(--primary);}
  .study-cta{margin-top:14px;text-align:center;}
  /* 全部工具抽屉 */
  .tools{text-align:center;margin-top:22px;}
  .tools-btn{display:inline-flex;align-items:center;gap:8px;font-family:inherit;font-size:13.5px;font-weight:800;
    letter-spacing:3px;color:var(--t2);background:#fff;border:1.5px solid var(--line);
    border-radius:999px;padding:11px 26px;cursor:pointer;transition:all .2s;box-shadow:0 3px 0 var(--line-soft);}
  .tools-btn:hover{border-color:var(--primary);color:var(--primary-deep);transform:translateY(-2px);}
  .tools-btn:active{transform:scale(.95);}
  body.night .tools-btn{background:rgba(255,255,255,.05);box-shadow:0 3px 0 rgba(0,0,0,.25);}
  .tools-btn .tri{transition:transform .25s;font-size:10px;}
  .tools-btn.open .tri{transform:rotate(180deg);}
  .tools-panel{display:none;margin-top:16px;text-align:left;}
  .tools-panel.open{display:block;animation:toolsin .25s ease;}
  @keyframes toolsin{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:translateY(0);}}
  .tools-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:10px;}
  .tool{display:flex;flex-direction:column;align-items:center;gap:7px;text-decoration:none;padding:13px 6px 11px;
    background:#fff;border:1.5px solid var(--line);border-radius:12px;transition:all .15s;}
  .tool:hover{transform:translateY(-3px);border-color:var(--primary);background:var(--primary-soft);}
  .tool:active{transform:scale(.94);}
  body.night .tool{background:rgba(255,255,255,.05);}
  body.night .tool:hover{background:rgba(111,190,158,.1);}
  .tool .ic{width:36px;height:36px;display:flex;align-items:center;justify-content:center;font-size:19px;
    background:var(--primary-soft);border:1.5px solid var(--line);border-radius:10px;}
  .tool .nm{font-size:12px;font-weight:700;color:var(--t2);letter-spacing:1px;}
  .foot b{color:var(--primary-deep);}
  body.night .foot b{color:var(--primary);}
</style>

<script src="town.js"></script>
<script>
var ls={get:function(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}},set:function(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
function todayStr(){var d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function pad(n){return String(n).padStart(2,'0');}
function fmtM(m){return m>=60?(Math.floor(m/60)+'h'+(m%60?m%60+'m':'')):m+'m';}

/* ============ ① 夜空星星 ============ */
(function(){
  var sky=document.getElementById('nightSky');
  for(var i=0;i<26;i++){
    var s=document.createElement('span');
    s.className='star';
    s.style.left=(Math.random()*97)+'vw';
    s.style.top=(Math.random()*60)+'vh';
    s.style.animationDelay=(Math.random()*3)+'s';
    s.style.animationDuration=(2.2+Math.random()*3)+'s';
    if(Math.random()<.25){s.style.width='2px';s.style.height='2px';}
    sky.appendChild(s);
  }
})();

/* ============ ② 问候：按模式切换文案 ============ */
(function(){
  var h=new Date().getHours();
  var nick=(ls.get('settings-v1-config')||{}).nick||'零';
  var night=document.body.classList.contains('night');
  var greet,line;
  if(night){
    if(h>=5&&h<11){greet='早上好';line='小镇刚醒，慢慢来。';}
    else if(h>=11&&h<17){greet='午安';line='午后的小镇，适合歇口气。';}
    else if(h>=17&&h<23){greet='晚上好';line='天黑了，小镇给你留了盏灯。';}
    else{greet='夜深了';line='夜深了，把今天轻轻放下吧。';}
    document.getElementById('welcome').textContent='🌙 '+greet+'，'+nick;
  }else{
    if(h>=5&&h<11){greet='早上好';line='慢慢来，比较快。今天也把日子过成喜欢的样子。';}
    else if(h>=11&&h<17){greet='午安';line='午后歇口气，下午继续加油。';}
    else if(h>=17&&h<23){greet='晚上好';line='今天辛苦啦，晚上好好放松。';}
    else{greet='夜深了';line='夜深了，早点休息，明天见。';}
    document.getElementById('welcome').textContent='🏡 '+greet+'，'+nick;
  }
  document.getElementById('slogan').textContent=line;
})();

/* ============ ③ 实时时钟 ============ */
(function(){
  function tick(){
    var d=new Date();
    document.getElementById('clock').textContent=pad(d.getHours())+':'+pad(d.getMinutes())+':'+pad(d.getSeconds());
    document.getElementById('clockDate').textContent=d.getFullYear()+'年'+(d.getMonth()+1)+'月'+d.getDate()+'日 · 星期'+['日','一','二','三','四','五','六'][d.getDay()];
  }
  tick();setInterval(tick,250);
})();

/* ============ ④ 倒计时 ============ */
(function(){
  var cds=ls.get('home-v1-countdown');
  if(!Array.isArray(cds))cds=[];
  function daysLeft(ds){
    var p=ds.split('-'),target=new Date(+p[0],+p[1]-1,+p[2]);
    var now=new Date();now.setHours(0,0,0,0);
    return Math.round((target-now)/86400000);
  }
  function renderCd(){
    var el=document.getElementById('cdList');
    var e0=document.getElementById('cdEmpty');
    if(cds.length){e0.style.display='none';e0.innerHTML='';}
    else{
      e0.style.display='block';
      townEmpty(e0,{art:'cal',title:'还没有重要日子',desc:'加一个考试或截止日期，让小镇帮你倒数',btn:'＋ 添加一个日子',onBtn:function(){document.getElementById('cdName').focus();}});
    }
    cds.sort(function(a,b){return daysLeft(a.d)-daysLeft(b.d);});
    ls.set('home-v1-countdown',cds);
    el.innerHTML='';
    cds.forEach(function(cd,i){
      var dl=daysLeft(cd.d);
      var cls=dl<0?'':dl===0?'today':dl<=3?'hot':'';
      var label=dl<0?'已过 '+(-dl)+' 天':dl===0?'就是今天 🎉':'还有 '+dl+' 天';
      var row=document.createElement('div');
      row.className='cd';
      row.innerHTML='<span class="nm">'+cd.n+'</span><span class="dt">'+cd.d+'</span><span class="days '+cls+'">'+label+'</span><button class="x" data-i="'+i+'">✕</button>';
      el.appendChild(row);
    });
    el.querySelectorAll('.x').forEach(function(x){
      x.onclick=function(){
        cds.splice(+x.dataset.i,1);
        renderCd();
        townToast('已移除倒计时');
      };
    });
  }
  document.getElementById('cdAdd').onclick=function(){
    var n=document.getElementById('cdName').value.trim();
    var d=document.getElementById('cdDate').value;
    if(!n){townToast('给这个日子起个名字吧 📌');return;}
    if(!d){townToast('选一个日期呀 📅');return;}
    cds.push({n:n,d:d});
    document.getElementById('cdName').value='';
    renderCd();
    var dl=daysLeft(d);
    townToast(dl===0?'就是今天，加油！🎉':'已记下，还有 '+dl+' 天');
  };
  renderCd();
})();

/* ============ ⑤ 今日学习进度 ============ */
(function(){
  function renderStudy(){
    var states=ls.get('studyplan-v1-states')||{};
    var sessions=ls.get('study-v1-sessions')||{};
    var checkins=ls.get('study-v1-checkins')||{};
    var a=states[todayStr()];
    var done=Array.isArray(a)?a.filter(Boolean).length:0;
    var total=Array.isArray(a)?a.length:0;
    var mins=0;(sessions[todayStr()]||[]).forEach(function(x){mins+=x.min||0;});
    var ck=!!checkins[todayStr()];
    var streak=0,d=new Date();
    if(!checkins[todayStr()])d.setDate(d.getDate()-1);
    while(checkins[d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')]){streak++;d.setDate(d.getDate()-1);}
    document.getElementById('stNum').innerHTML=done+'<small> / '+total+' 项</small>';
    document.getElementById('stBar').style.width=(total?Math.round(done/total*100):0)+'%';
    if(!total&&!mins){
      document.getElementById('stLine').textContent='今天还没有学习记录，去计划页开个番茄钟吧 🍅';
    }else{
      document.getElementById('stLine').innerHTML=total
        ?'已完成 <b>'+done+'/'+total+'</b> 项'+(total-done?'，还有 '+ (total-done)+' 项等点亮':'，全部点亮啦 ✨')
        :'今天还没有任务清单，先专注一会儿吧';
    }
    var pills=[
      '⏱ 今日专注 <b>'+fmtM(mins)+'</b>',
      ck?'✅ 今日已打卡':'○ 今日未打卡',
      streak?'🔥 连续 '+streak+' 天':''
    ].filter(Boolean);
    document.getElementById('stMeta').innerHTML=pills.map(function(p){return '<span class="pill">'+p+'</span>';}).join('');
  }
  renderStudy();
})();

/* ============ ⑥ 全部工具抽屉 ============ */
(function(){
  var TOOLS=[
    ['study-plan.html','📋','学习计划'],['study-stats.html','📊','学习统计'],['study-library.html','📚','学习资料'],
    ['contest-zone.html','🏆','竞赛备考'],['speech-practice.html','💬','话术练习'],['money-tracker.html','📒','收支账本'],
    ['notes.html','📝','便签笔记'],['blog.html','📰','博客精选'],['podcast-picks.html','🎧','播客精选'],
    ['habit-wall.html','✅','习惯打卡'],['town-weather.html','🌤','今日天气'],['bgm-player.html','🎵','小镇BGM'],
    ['night-journal.html','🌙','睡前小记'],['town-shop.html','🏪','小镇商店'],['settings.html','⚙️','小镇设置']
  ];
  var grid=document.getElementById('toolsGrid');
  TOOLS.forEach(function(t){
    var a=document.createElement('a');
    a.className='tool';
    a.href=t[0];
    a.innerHTML='<span class="ic">'+t[1]+'</span><span class="nm">'+t[2]+'</span>';
    grid.appendChild(a);
  });
  var btn=document.getElementById('toolsBtn'),panel=document.getElementById('toolsPanel');
  btn.onclick=function(){
    var open=panel.classList.toggle('open');
    btn.classList.toggle('open',open);
    btn.querySelector('.tri').textContent=open?'▲':'▼';
  };
})();
</script>
